name: Suggest an idea
description: A feature, a research question, or related work we should know about.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like to see, or what should we look into?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it matters
      description: The problem it solves or the question it answers, and who it helps.
  - type: textarea
    id: related
    attributes:
      label: Related work
      description: Papers, projects, or discussions we should read.
